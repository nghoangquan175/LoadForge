# Test -> build images to GHCR -> roll them out on AWS.
#
# Deploy needs the repo variable AWS_DEPLOY_ROLE_ARN (from infra/ci).
# Without it, or while the AWS stack is destroyed, only test and build run.

name: Build and deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  PROJECT: loadforge
  ASG_NAME: loadforge-asg

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm 10 fails to install this workspace, see README.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm test -w @loadforge/defender
      - run: npm run test:e2e -w @loadforge/defender
      - run: npm test -w @loadforge/watcher
      - run: npm run test:e2e -w @loadforge/watcher
      # Route types (LayoutProps, ...) come from next typegen, not from git.
      - run: npx next typegen && npx tsc --noEmit
        working-directory: apps/dashboard

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [defender, watcher, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/loadforge-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/loadforge-${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: build
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Image parameters come from `terraform apply` in infra/. Missing means
      # the stack is destroyed (or not yet migrated): build only, no deploy.
      - name: Check the stack
        id: stack
        run: |
          if aws ssm get-parameter --name "/$PROJECT/deploy/watcher-image" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::/$PROJECT/deploy/watcher-image not found (stack destroyed?), skipping deploy"
          fi

      - name: Point SSM at the new images
        if: steps.stack.outputs.ready == 'true'
        run: |
          for app in defender watcher dashboard; do
            image="ghcr.io/${{ github.repository_owner }}/loadforge-$app:${{ github.sha }}"
            aws ssm put-parameter --name "/$PROJECT/deploy/$app-image" --type String --overwrite --value "$image" >/dev/null
            echo "$app -> $image"
          done

      - name: Roll the Defender Auto Scaling Group
        if: steps.stack.outputs.ready == 'true'
        run: |
          found=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" \
            --query 'length(AutoScalingGroups)' --output text)
          if [ "$found" = "0" ]; then
            echo "::notice::$ASG_NAME not found (stack destroyed?), skipping"
            exit 0
          fi

          # Launch-before-terminate (min 100%, max 200%): a new server must be
          # healthy before an old one stops, so no downtime even with 1 server.
          # A newer image supersedes any refresh still running.
          aws autoscaling cancel-instance-refresh --auto-scaling-group-name "$ASG_NAME" >/dev/null 2>&1 || true

          # The refresh launches one new server per running one. With light
          # traffic that is wasted: first shrink to what the CPU target needs
          # (busiest 5 minutes of the last 10, at least the group's minimum).
          # Under load nothing is removed, and the scaling rules grow the group
          # again if load comes back.
          read -r desired min <<<"$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" \
            --query 'AutoScalingGroups[0].[DesiredCapacity,MinSize]' --output text)"
          target=$(aws autoscaling describe-policies --auto-scaling-group-name "$ASG_NAME" --policy-types TargetTrackingScaling \
            --query 'ScalingPolicies[0].TargetTrackingConfiguration.TargetValue' --output text)
          cpu=$(aws cloudwatch get-metric-statistics --namespace AWS/EC2 --metric-name CPUUtilization \
            --dimensions Name=AutoScalingGroupName,Value="$ASG_NAME" \
            --start-time "$(date -u -d '-10 minutes' +%FT%TZ)" --end-time "$(date -u +%FT%TZ)" \
            --period 300 --statistics Average --query 'max(Datapoints[].Average)' --output text)
          if [ "$cpu" != "None" ] && [ "$target" != "None" ]; then
            needed=$(awk -v d="$desired" -v c="$cpu" -v t="$target" -v m="$min" \
              'BEGIN { n = d * c / t; n = (n == int(n)) ? n : int(n) + 1; print (n < m ? m : n) }')
            echo "avg CPU ${cpu}% on $desired servers (target ${target}%): $needed needed"
            if [ "$needed" -lt "$desired" ]; then
              aws autoscaling set-desired-capacity --auto-scaling-group-name "$ASG_NAME" \
                --desired-capacity "$needed" --no-honor-cooldown
              # Let the extra servers drain and go before refreshing the rest.
              for attempt in $(seq 1 40); do
                busy=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" \
                  --query "length(AutoScalingGroups[0].Instances[?LifecycleState!='InService'])" --output text)
                [ "$busy" = "0" ] && break
                sleep 15
              done
            fi
          fi
          for attempt in $(seq 1 20); do
            if id=$(aws autoscaling start-instance-refresh --auto-scaling-group-name "$ASG_NAME" \
                 --preferences '{"MinHealthyPercentage":100,"MaxHealthyPercentage":200,"InstanceWarmup":60}' \
                 --query InstanceRefreshId --output text 2>err.txt); then
              break
            fi
            grep -q InstanceRefreshInProgress err.txt || { cat err.txt; exit 1; }
            sleep 15
          done
          echo "instance refresh $id started"

          for attempt in $(seq 1 80); do
            read -r status pct <<<"$(aws autoscaling describe-instance-refreshes --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$id" --query 'InstanceRefreshes[0].[Status,PercentageComplete]' --output text)"
            echo "$(date +%T) $status ${pct}%"
            case "$status" in
              Successful) exit 0 ;;
              Failed|Cancelled|RollbackSuccessful|RollbackFailed) exit 1 ;;
            esac
            sleep 15
          done
          echo "::warning::refresh still running after 20 minutes"

      # Runs the dashboard and the Watcher containers.
      - name: Redeploy the dashboard instance
        if: steps.stack.outputs.ready == 'true'
        run: |
          id=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$PROJECT-web" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ "$id" = "None" ] || [ -z "$id" ]; then
            echo "::notice::dashboard instance not found, skipping"
            exit 0
          fi

          cmd=$(aws ssm send-command --instance-ids "$id" --document-name AWS-RunShellScript \
            --comment "deploy ${{ github.sha }}" \
            --parameters 'commands=["/usr/local/bin/loadforge-deploy"]' \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$cmd" --instance-id "$id" || true
          aws ssm get-command-invocation --command-id "$cmd" --instance-id "$id" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text | tee result.txt
          head -1 result.txt | grep -q '^Success'
